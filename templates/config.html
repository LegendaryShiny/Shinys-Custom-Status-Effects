<form class="scse-config">
  <p class="notes">
    Add, edit, or remove your own conditions below — changes save
    automatically as you edit.
  </p>

  <table class="scse-list">
    <thead>
      <tr>
        <th style="width: 32px;"></th>
        <th>ID</th>
        <th>Name</th>
        <th>Icon</th>
        <th style="width: 32px;"></th>
      </tr>
    </thead>
    <tbody>
      {{#each conditions as |c|}}
      <tr class="cond-row" data-id="{{c.id}}">
        <td><img class="cond-preview" src="{{c.img}}" width="24" height="24" style="border: none;"></td>
        <td><input type="text" class="cond-id" value="{{c.id}}"></td>
        <td><input type="text" class="cond-name" value="{{c.name}}"></td>
        <td>
          <div class="icon-field">
            <input type="text" class="cond-img" value="{{c.img}}">
            <button type="button" class="pick-image" title="Choose icon">
              <i class="fas fa-file-image"></i>
            </button>
          </div>
        </td>
        <td>
          <a class="delete-condition" title="Delete">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
      {{else}}
      <tr><td colspan="5"><em>No custom conditions yet.</em></td></tr>
      {{/each}}
    </tbody>
  </table>

  <button type="button" class="add-condition">
    <i class="fas fa-plus"></i> Add Condition
  </button>

  <div class="scse-actions">
    <button type="button" class="export-conditions" title="Download your custom conditions as a JSON file">
      <i class="fas fa-download"></i> Export
    </button>
    <button type="button" class="import-conditions" title="Add conditions from a previously exported JSON file">
      <i class="fas fa-upload"></i> Import
    </button>
    <input type="file" class="import-file-input" accept="application/json" style="display: none;">
    <button type="button" class="save-reload">
      <i class="fas fa-rotate"></i> Save &amp; Reload
    </button>
  </div>
</form>
