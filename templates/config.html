<form class="scse-config">
  <p class="notes">
    Änderungen werden sofort gespeichert. Foundry danach einmal neu laden
    (F5), damit neue/entfernte Zustände im Token-HUD aktualisiert werden.
  </p>

  <table class="scse-list" style="width: 100%; margin-bottom: 1em;">
    <thead>
      <tr>
        <th style="width: 32px;"></th>
        <th>Name</th>
        <th>ID</th>
        <th style="width: 32px;"></th>
      </tr>
    </thead>
    <tbody>
      {{#each conditions as |c|}}
      <tr>
        <td><img src="{{c.img}}" width="24" height="24" style="border: none;"></td>
        <td>{{c.name}}</td>
        <td><code>{{c.id}}</code></td>
        <td>
          <a class="delete-condition" data-id="{{c.id}}" title="Entfernen">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
      {{else}}
      <tr><td colspan="4"><em>Noch keine eigenen Zustände.</em></td></tr>
      {{/each}}
    </tbody>
  </table>

  <hr>

  <h3>Neue Condition hinzufügen</h3>

  <div class="form-group">
    <label>ID (eindeutig, nur Buchstaben/Zahlen/Bindestriche)</label>
    <input type="text" name="newId" placeholder="z.b. mein-effekt">
  </div>

  <div class="form-group">
    <label>Anzeigename</label>
    <input type="text" name="newName" placeholder="z.b. Mein Effekt">
  </div>

  <div class="form-group">
    <label>Icon</label>
    <div style="display: flex; gap: 4px;">
      <input type="text" name="newImg" placeholder="icons/svg/aura.svg" style="flex: 1;">
      <button type="button" class="pick-image" title="Icon auswählen">
        <i class="fas fa-file-image"></i>
      </button>
    </div>
  </div>

  <button type="button" class="add-condition">
    <i class="fas fa-plus"></i> Hinzufügen
  </button>
</form>
